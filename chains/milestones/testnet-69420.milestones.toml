# FINAL — re-genesis milestone set (v0.3.3, chain-69420).
# Finalized from milestones-v033-draft.toml (entry semantics UNCHANGED):
#   - entries re-sorted into canonical (height, id) ascending order, which the
#     loader (from_toml -> validate_entry_order) requires: at height 2000 the
#     f154 entry sorts before the f58 entry ("f154-..." < "f58-..." lexically).
#   - [meta] finalized in the UNSIGNED form: only chain_id drives load;
#     signer_set_id/threshold/signers are legacy accepted-but-ignored fields
#     (issue #86) and the [[signatures]] blocks are omitted entirely
#     (#[serde(default)]). The canonical digest is entries-only
#     (SHA-256(REGISTRY_DOMAIN_TAG || serde_json(entries))), so a signed file
#     with identical entries digests identically. Authenticity is off-chain:
#     genesis milestone_digest pin (#111) + chain-registry milestones_sha256 +
#     cosign attestation.
# VALIDATED: protocore (v0.3.3, sha256 e5af6e2e...) milestones digest <file>
# loads this file through the boot path and prints the canonical digest.

