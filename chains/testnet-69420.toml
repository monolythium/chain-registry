# 2026-07-07 v0.4.0 4-CLUSTER (n=4, f=1) RE-GENESIS: genesis 0xbe1b3a3c, protocore v0.4.0-testnet
# (bin 259c67c1, mono-core da04f8f5). Structure NOW = 4 DVT clusters x 7 operators,
# 5-of-7 threshold (was 2x10). milestone_digest 0xb9f4a07f + milestones_sha256
# 7efe5018 UNCHANGED. A whole cluster/seat can fail without halting (proven live).
