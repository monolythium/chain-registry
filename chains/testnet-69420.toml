chain_id     = 69420
# 2026-07-25 Posture-C V16 R5 4-cluster / 40-operator (7-of-10)
# re-genesis, accepted by the live-cut evidence gate.
network      = "testnet-69420"
display_name = "Monolythium Testnet"
description  = "Live development testnet for Monolythium / LythiumDAG-BFT. Foundation-operated. Wipe + regenesis is allowed without notice — do NOT store value on this network."

# Canonical V16 R5 genesis identity. `genesis_hash` is the value emitted by the
# mono-core genesis verifier; `genesis_sha256` pins the exact authored bytes.
genesis_hash   = "0x8dfc309dfe8e35b4ca036631c7dc25b29e618ac8a9694e0e2bbe23d0f98ab1fe"
genesis_url    = "https://raw.githubusercontent.com/monolythium/chain-registry/master/chains/genesis/testnet-69420.genesis.toml"
genesis_sha256 = "0a02cabfb7d84cea3e77dcac76990ce3ceda233c7ba0d6f067d2b5b6e53dbb8a"

# Exact mono-core network-registry.toml installed on the accepted R5 fleet and
# committed by the genesis treasury policy.
network_registry_sha256 = "ef296a44b8ea83626b9bfcbfff4df6b47049ed0cd910d07defc7dfa2ef7853d4"

# Posture-C milestone authority is rooted in genesis (`milestone_signer_root`,
# threshold 2). The exact signed milestone artifact is vendored beside genesis.
# 0x110A remains disabled at the cut. A plain edit/unsigned "milestone roll" is
# not a valid re-arm: any future change must be a threshold-authorized signed
# append accepted by the Posture-C verification path.
milestones_url    = "https://raw.githubusercontent.com/monolythium/chain-registry/master/chains/milestones/testnet-69420.milestones.toml"
milestones_sha256 = "7739c3d702b72586dd9880bafedb3967393fab679e4d2e3268d038bcd7c452e7"

# Exact source and executable accepted on the V16 R5 fleet. The frozen source
# tree is 30a34766f75ee74b39ced71d8158666392f8e8e6. The native-PQ public RPC
# gateway binary is b9eb72497d58e95354a6917d3821009522d98745f5a55cbf9533f3b675c4f428.
binary_sha            = "f052832c62ad5640fa7a419018bba4b120a18587"
binary_release_sha256 = "477704b170b620e9b52255b1dc26dddfcadb8664052867c1750ac40e3764851b"
release_tag           = "v0.4.1-testnet"
# PENDING (deliberately not invented): `release_tarball_sha256` requires the
# final signed release asset. Add it only after downloading and hashing the
# published immutable tarball.

# Wallet-facing JSON-RPC. R5 operator and relay RPC ports require the native-PQ
# transport and are intentionally not advertised as plaintext HTTP endpoints.
[[rpc]]
url      = "https://rpc.monolythium.com"
provider = "monolythium-foundation"
tier     = "official"
notes    = "canonical native-PQ-terminating public RPC gateway"

