# Pinned to the genesis the live cluster is currently running. Any
# wipe + regenesis flips this hash and bumps the registry entry.
# 2026-07-04 v0.3.4 BRIDGE-FREE RE-GENESIS (protocore v0.3.4-testnet, mono-core
# master @ 81ff5a2d) set the genesis_hash below, superseding the 2026-07-03
# v0.3.3 genesis 0x5d5c36ef…. This roll cut a fresh genesis on the lean binary
# after the in-tree bridge stack was removed (the interop route is an external
# provider now — the bridge verifier/route/economics code and the
# sp1-bridge-verifier feature no longer exist; the removal was proven
# state-root-identical against the prior chain before the cut). The MILESTONE
# SET IS UNCHANGED from v0.3.3 (milestones_sha256 7efe5018, canonical digest
# milestone_digest = 0xb9f4a07f2733de49055c171dbbe938f336dfb070d24a83f7af4c64d1b9d2bd7f
# in genesis.toml — it never referenced the bridge, so it carries over): public-
# profile nodes hard-refuse to boot with a missing or divergent milestones.toml,
# closing the divergent-milestone fork hole. Armed at genesis: dynamic DVT
# cluster lifecycle from height 0, service-weighted operator earning from height
# 0 (service_score_live_roster_height = 0 + charterless_equal_split_height = 0),
# block.timestamp wall-clock clamp + parent-monotonicity at height 2000, open-
# seat marketplace at height 4000. The escrow precompile 0x110A is gated OFF at
# genesis (re-armed by a future milestone roll once its dispute-timeout paths
# are proven live); confidential value ops remain gated off (DEC-029). The
# re-genesis regenerated the 2x10 operator p2p keys from the standard BIP-39 ->
# ML-DSA-65 mnemonics (fresh [[p2p]] peer IDs below); the two relay p2p
# identities carried over. Structure — 2 consensus seats, each a 10-operator
# cluster (threshold 7-of-10) — unchanged; see chains/genesis.
genesis_hash = "0xe22733f4d7e013b93f0f825667fcf852cbf7ad1ca31a42a1bfcf1ab6d79c89a3"

# ---- Dynamic genesis resolution ----
# Full genesis content for this network, committed in this repo and served
# over raw.githubusercontent. A booting node fetches genesis_url, recomputes
# keccak256 over the raw on-disk bytes, and requires it to equal genesis_hash
# above BEFORE init. This lets the OS image bake WHO to trust (this registry
# path) rather than WHAT to run (no baked hash), so a re-genesis is picked up
# on the next boot with no image rebuild.
#
# TRUST NOTE (testnet): genesis_hash is the authoritative pin and the only
# integrity check on testnet. The expected hash and the served content share
# one trust root (this repo / GitHub), so the keccak match is CIRCULAR — it is
# NOT cryptographic integrity against a registry or GitHub compromise. This is
# acceptable only because testnet is value-less and wiped without notice. See
# README.md "Dynamic genesis resolution" and the mainnet-only groundwork below.
genesis_url    = "https://raw.githubusercontent.com/monolythium/chain-registry/master/chains/genesis/testnet-69420.genesis.toml"
genesis_sha256 = "5e5e6e0301bf742e2b7e81794ac20ca3fb5f39fdadf54230e1e0c625f9bf2cbb"

# ---- Canonical milestone config (rolling-upgrade mechanism) ----
# The canonical, cosigned milestone config for this network, committed in this
# repo. Milestones activate protocol parameters / precompile gates at chosen
# heights without a re-genesis. This is the CANONICAL REFERENCE, not a runtime
# fetch: operators fetch milestones_url at deploy time, `cosign verify-blob` the
# .sig/.pem published by the milestones-attestation CI to the rolling GitHub
# Release `milestones-testnet-69420` (master requires PRs, so the bot publishes
# the cosign artifacts to a Release rather than committing them beside the file),
# then deploy and roll the fleet before the new activation height. The chain
# loads the file as plain config (no in-file signature); as of the v0.3.3
# re-genesis the genesis PINS milestone_digest (entries-only canonical digest),
# so every node cryptographically refuses a divergent file at boot — this sha
# pin + the cosign blob remain the deploy-time distribution checks on top.
milestones_url    = "https://raw.githubusercontent.com/monolythium/chain-registry/master/chains/milestones/testnet-69420.milestones.toml"
milestones_sha256 = "7efe5018adb5b2566c732f57f4e440338cf69a05f17fb37e3ad164e9dddc3ec8"

# ---- MAINNET-ONLY genesis hardening (groundwork — not used on testnet) ----
# These fields are documented placeholders for the mainnet trust model and are
# intentionally left commented. They MUST NOT carry active values on this
# testnet entry; a node MUST ignore them for testnet-69420. They break the
# circular testnet trust by adding factors the registry writer does not
# control. See README.md "Dynamic genesis resolution" for the full model.
#
# genesis_sig_url      = "<https URL of the cosign-signed genesis blob signature>"
#   Detached cosign signature (.sig) over the genesis blob, fetched and
#   verified with `cosign verify-blob` BEFORE the keccak hash check.
#
# genesis_cert_identity = "<cosign certificate identity / SAN regex>"
#   Expected signing identity (OIDC SAN regex) baked into the signed OS image,
#   NOT trusted from the registry. The image pins WHO may sign genesis.
#
# genesis_cert_issuer   = "<cosign OIDC issuer URL>"
#   Expected OIDC issuer for the cosign certificate (e.g. the GitHub Actions
#   OIDC issuer). Also image-baked, used with genesis_cert_identity.
#
# registry_rev          = "<full 40-char commit SHA of this registry>"
#   Commit-SHA pin for this registry, baked per signed image instead of the
#   moving `master` ref, so a registry-account compromise or stale CDN edge
#   cannot silently redirect genesis_hash / genesis_url.

# mono-core commit used to build the advertised foundation operator binary.
# 2026-07-02 v0.3.2 LIFECYCLE RE-GENESIS to `v0.3.2-testnet`, mono-core
# master @ 3c698c85 (version 0.3.2) — see genesis 0x323399b4… above. v0.3.2
# keeps the dynamic DVT cluster lifecycle active from genesis and fully purges
# The cosigned v0.3.4 protocore release binary (built with the BRIDGE-FREE
# feature set mdbx,indexer-postgres,mesh,sp1-verifier by the boot-smoke-gated
# release pipeline — the sp1-bridge-verifier feature was removed with the
# in-tree bridge stack) has sha256 =
# 8472107f155ce9119ded703c7b6b8b935d66fdb1edba62a7b827d096ece847b8
# (= binary_release_sha256 below). The live fleet runs THIS release binary.
#
# The `v0.3.4-testnet` GitHub release (tarball + cosign attestation) IS
# published; its EXTRACTED protocore binary sha256 == binary_release_sha256
# below (8472107f…), and the release .tar.gz sha256 == release_tarball_sha256
# below. This binary drops the entire in-tree bridge stack (0x1008 verifier /
# route / economics; SP1-Helios + CCIP) — the interop route becomes an external
# provider integration. It retains the milestone-digest boot anchor (#111), the
# round-keyed commit-path service-score settle gate (#212), escrow dispute
# timeouts (#114/#108), the gated parent-monotonic timestamp clamp (#154),
# and replay-verify armed by default on public profiles (#118).
#
# 2026-07-06 v0.3.5 ROLLING BINARY SWAP (protocore v0.3.5-testnet, mono-core
# master @ 35b40a79 = 81ff5a2d + #229 + version bump). Genesis 0x25fd542b,
# milestones 7efe5018, and milestone_digest 0xb9f4a07f are UNCHANGED — this is a
# cosigned rolling swap, NOT a re-genesis. #229 fixes a tx-DELIVERY bug: the RPC
# submit path (LiveTxBroadcaster::submit_raw) admitted a locally-submitted tx to
# the local mempool but never broadcast it to Topic::Tx, so txs sent to any node
# other than a cluster proposer were never included. v0.3.5 publishes the tx to
# the gossip topic after admit (+ resurrects the mempool in_flight release). The
# extracted release binary sha256 = f0dc28c6… (= binary_release_sha256 below);
# the whole fleet runs THIS binary.
#
# Keep `binary_sha` = 35b40a79 in lock-step with the mono-core-sdk pin
# (packages/ts/src/registry.ts) and the browser-wallet build-info trust pin.
binary_sha   = "da04f8f5"

# First-class binary provenance keys (machine-readable; consumed by the Monarch
# OS release-drift guard `scripts/verify-release-matches-registry.sh`). These
# MUST stay in lock-step with the comment block above on every re-genesis /
# rolling binary swap. `release_tag` is the signed protocore release operators
# run; `binary_release_sha256` is the sha256 of the EXTRACTED `protocore`
# binary from that release's linux tarball (NOT the mono-core commit, which is
# `binary_sha`).
release_tag           = "v0.4.0-testnet"
binary_release_sha256 = "259c67c1c7fc8bc3f8ca22c82953ea7dc54a9e2ceaa02d0fe0879ab5192f8227"
# sha256 of the published v0.3.2-testnet release .tar.gz (its EXTRACTED binary
# sha256 = binary_release_sha256 = c633e3a7… above; the .tar.gz carries the
# cosign .sig/.pem produced by the protocore release.yml tag-workflow identity).
release_tarball_sha256 = "732874becf4520da1d074969c301a7327cd738127e18b4751799fead32e1aa73"

